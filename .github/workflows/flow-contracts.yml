name: Flow Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flow-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate source syntax and regression contracts
        run: npm run validate
